name: Compilar para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Rust para Windows x64
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Validar la versión SemVer de la aplicación
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo no pudo validar la versión' }
          $version = ($metadata.packages | Where-Object name -eq 'xminus-tauri-vue').version
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $npm = Get-Content package.json -Raw | ConvertFrom-Json
          if (!$version -or $version -cne $tauri.version -or $version -cne $npm.version) {
            throw 'Las versiones de Cargo, Tauri y npm deben coincidir'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la aplicación y el instalador NSIS
        run: npm run tauri -- build --bundles nsis -- --locked

      - name: Verificar la actualización desde v0.3.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $oldSetup = Join-Path $env:RUNNER_TEMP 'previous-setup.exe'
          gh release download v0.3.0 --pattern '*x64-setup.exe' --output $oldSetup
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo obtener el instalador v0.3.0' }
          if ((Get-FileHash $oldSetup).Hash -ne '5fe4c6166494cc199be74e34c0fff381d1faa723a7cafb9b9d7bd6369877e05a') {
            throw 'El instalador anterior no coincide con la release verificada'
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'X-Minus instalado'
          $installedExe = Join-Path $installDir 'xminus-tauri-vue.exe'
          $old = Start-Process $oldSetup -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($old.ExitCode -ne 0 -or !(Test-Path $installedExe)) { throw 'Falló la instalación inicial' }

          $newSetup = Get-Item 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          $upgrade = Start-Process $newSetup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Falló la actualización' }
          $expected = Get-FileHash 'src-tauri/target/release/xminus-tauri-vue.exe'
          if ((Get-FileHash $installedExe).Hash -ne $expected.Hash) {
            Get-ChildItem $installDir,"$env:LOCALAPPDATA/X-Minus Stems" -Filter '*.exe' -ErrorAction SilentlyContinue |
              Select-Object FullName,@{Name='Version';Expression={$_.VersionInfo.ProductVersion}} | Format-List
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\X-Minus Stems' |
              Select-Object DisplayVersion,InstallLocation,UninstallString | Format-List
            throw 'El ejecutable nuevo no está en la carpeta original'
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\X-Minus Stems'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ((Get-ItemPropertyValue $key DisplayVersion) -ne $version) {
            throw 'Windows no registró la nueva versión'
          }

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: xminus-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ needs.windows.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xminus-windows-x64
          path: installer

      - name: Publicar la versión verificada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          shopt -s nullglob
          installers=(installer/*-setup.exe)
          [[ ${#installers[@]} == 1 ]] || { echo 'Se esperaba exactamente un instalador'; exit 1; }

          if existing=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$existing" == false ]]; then
              echo "La release $tag ya está publicada."
              exit 0
            fi
            echo "::error::Ya existe un borrador para $tag. Revisa su contenido antes de publicarlo."
            exit 1
          fi

          args=(--target "$GITHUB_SHA" --title "X-Minus Stems $VERSION" --generate-notes)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$tag" "${installers[0]}" "${args[@]}"
